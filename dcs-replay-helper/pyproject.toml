[project]
name = "dcs-replay-helper"
version = "0.1.0"
description = "Drive DCS track replays from Tacview bookmarks: seek forward with a speed cap and pre/post-roll"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
]

[project.scripts]
replay-helper = "replay_helper.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "lupa>=2.0",  # runs the DCS hook in Lua 5.1 for tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replay_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
